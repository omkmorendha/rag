[project]
name = "rag"
version = "0.1.0"
description = "Local-first RAG experiment harness over Markdown and PDF documents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.105.2",
    "claude-agent-sdk>=0.2.90",
    "faiss-cpu>=1.14.2",
    "ftfy>=6.3.1",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.pyright]
# Resolve imports against the uv-managed virtualenv (where `uv add` installs deps),
# not the system interpreter. Without this, Pyright reports ftfy/pyarrow as missing.
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pytest>=9.0.3",
]
