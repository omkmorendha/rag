# Swap chunking strategies by changing `chunker.name`.
#
# Available chunkers:
#   fixed            size/overlap whitespace-token windows; useful as a baseline
#   recursive        paragraph/sentence-aware windows; default for Markdown
#   sentence_window  overlapping sentence groups; useful for precise retrieval units

chunker:
  name: recursive
  size: 256
  overlap: 32

embedder:
  name: local
  model: BAAI/bge-small-en-v1.5
  batch_size: 32
  normalize_embeddings: true

# Swap index structures by changing `indexer.name`.
#
# Available indexers:
#   faiss_flat       exact (brute-force) inner-product search; baseline
indexer:
  name: faiss_flat

# Rewrite the query before retrieval. Retrieval uses the transformed query; the
# generator still answers the ORIGINAL question.
#
# Available query transforms: passthrough | rewrite | step_back
#   passthrough      return the query unchanged; honest baseline
#   rewrite          LLM expands abbreviations / adds entities for dense retrieval (needs API)
#   step_back        LLM generalizes to a broader question for background (needs API)
query_transform:
  name: passthrough

# Over-retrieve here (k≈50); the reranker compresses the candidates afterwards.
#
# Available retrievers:
#   dense            semantic search over the vector index; baseline
retriever:
  name: dense
  k: 50

# Swap reranking strategies by changing `reranker.name`.
#
# Available rerankers:
#   noop             pass candidates through (optional top_n cap); for the slice
#   cross_encoder    local cross-encoder re-scoring; the first real quality jump
reranker:
  name: cross_encoder
  model: BAAI/bge-reranker-base
  top_n: 8

# The final stage: a grounded, cited answer from the reranked chunks.
#
# Available generators:
#   anthropic        Claude via the Messages API; answers strictly from the chunks
generator:
  name: anthropic
  model: claude-haiku-4-5
  max_tokens: 1024
