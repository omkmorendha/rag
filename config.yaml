# Swap chunking strategies by changing `chunker.name`.
#
# Available chunkers:
#   fixed            size/overlap whitespace-token windows; useful as a baseline
#   recursive        paragraph/sentence-aware windows; default for Markdown
#   sentence_window  overlapping sentence groups; useful for precise retrieval units

chunker:
  name: recursive
  size: 256
  overlap: 32

embedder:
  name: local
  model: BAAI/bge-small-en-v1.5
  batch_size: 32
  normalize_embeddings: true

# Swap index structures by changing `indexer.name`.
#
# Available indexers:
#   faiss_flat       exact (brute-force) inner-product search; baseline
indexer:
  name: faiss_flat
